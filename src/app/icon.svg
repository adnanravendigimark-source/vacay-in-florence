<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded Brand Shield / Badge in Deep Forest Green -->
  <rect width="64" height="64" rx="16" fill="#142d22" />

  <!-- Ground Platform Line -->
  <rect x="8" y="52" width="48" height="3" rx="1.5" fill="#fcfbfa" />

  <!-- Cathedral Base Arcade -->
  <path d="M11 52V43H41V52" stroke="#fcfbfa" stroke-width="2.5" stroke-linejoin="round" />
  <!-- Arches in base -->
  <path d="M15 52V46C15 44.8954 15.8954 44 17 44C18.1046 44 19 44.8954 19 46V52" fill="#fcfbfa" />
  <path d="M23 52V45C23 43.8954 23.8954 43 25 43C26.1046 43 27 43.8954 27 45V52" fill="#fcfbfa" />
  <path d="M31 52V46C31 44.8954 31.8954 44 33 44C34.1046 44 35 44.8954 35 46V52" fill="#fcfbfa" />

  <!-- Drum Tier -->
  <path d="M12 43V36H40V43" stroke="#fcfbfa" stroke-width="2.5" stroke-linejoin="round" />
  <!-- Drum Oculus Windows (Terracotta / Gold) -->
  <circle cx="17" cy="39.5" r="1.6" fill="#c1502e" />
  <circle cx="26" cy="39.5" r="1.6" fill="#c1502e" />
  <circle cx="35" cy="39.5" r="1.6" fill="#c1502e" />

  <!-- Brunelleschi Octagonal Dome -->
  <path d="M12 36C12 23 19 14.5 26 14.5C33 14.5 40 23 40 36Z" fill="#c1502e" fill-opacity="0.3" stroke="#fcfbfa" stroke-width="2.8" stroke-linejoin="round" />
  <!-- Center & Side Ribs -->
  <path d="M26 14.5V36" stroke="#fcfbfa" stroke-width="2.2" />
  <path d="M19 19.5C22.5 25 24 30.5 24 36" stroke="#fcfbfa" stroke-width="1.5" stroke-opacity="0.8" />
  <path d="M33 19.5C29.5 25 28 30.5 28 36" stroke="#fcfbfa" stroke-width="1.5" stroke-opacity="0.8" />

  <!-- Lantern & Cross -->
  <rect x="23.5" y="9.5" width="5" height="5.5" fill="#fcfbfa" rx="0.5" />
  <line x1="26" y1="9.5" x2="26" y2="4.5" stroke="#fcfbfa" stroke-width="2.2" stroke-linecap="round" />
  <line x1="23.5" y1="6.5" x2="28.5" y2="6.5" stroke="#fcfbfa" stroke-width="2.2" stroke-linecap="round" />
  <circle cx="26" cy="8" r="1.2" fill="#b8863b" />

  <!-- Giotto's Campanile Bell Tower (Right) -->
  <path d="M45 52V10H53V52" stroke="#fcfbfa" stroke-width="2.5" stroke-linejoin="round" />
  <path d="M43.5 10H54.5L49 4.5L43.5 10Z" fill="#fcfbfa" />
  <line x1="45" y1="21" x2="53" y2="21" stroke="#fcfbfa" stroke-width="1.8" />
  <line x1="45" y1="32" x2="53" y2="32" stroke="#fcfbfa" stroke-width="1.8" />
  <line x1="45" y1="42" x2="53" y2="42" stroke="#fcfbfa" stroke-width="1.8" />
  <!-- Arched Windows in Tower -->
  <path d="M47.5 18V15.5C47.5 14.7 48.2 14 49 14C49.8 14 50.5 14.7 50.5 15.5V18" stroke="#c1502e" stroke-width="1.5" />
  <path d="M47.5 29V26.5C47.5 25.7 48.2 25 49 25C49.8 25 50.5 25.7 50.5 26.5V29" stroke="#c1502e" stroke-width="1.5" />
  <path d="M47.5 39V36.5C47.5 35.7 48.2 35 49 35C49.8 35 50.5 35.7 50.5 36.5V39" stroke="#c1502e" stroke-width="1.5" />
</svg>
